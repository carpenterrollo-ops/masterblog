<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>

    <div style="text-align: center; margin-bottom: 20px;">
        <a href="{{ url_for('add') }}" style="display: inline-block; padding: 10px 15px; background-color: #4F4F4F; color: white; text-decoration: none; border-radius: 5px;">
            + Neuen Beitrag hinzufügen
        </a>
    </div>

    {% for blogpost in posts %}
    <div class="post">
        <h2>{{blogpost['title']}}</h2>
        <p><em>{{blogpost['author']}}</em></p>
        <p>{{blogpost['content']}}</p>
    </div>
    {% endfor %}
</body>
</html>
