<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>

    <div style="text-align: center; margin-bottom: 20px;">
        <a href="{{ url_for('add') }}" style="display: inline-block; padding: 10px 15px; background-color: #4F4F4F; color: white; text-decoration: none; border-radius: 5px;">
            + Neuen Beitrag hinzufügen
        </a>
    </div>

    {% for blogpost in posts %}
    <div class="post">
        <h2>{{blogpost['title']}}</h2>
        <p><em>{{blogpost['author']}}</em></p>
        <p>{{blogpost['content']}}</p>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <!-- Bearbeiten-Button (Link zur Route /update/<post_id>) -->
            <a href="{{ url_for('update', post_id=blogpost['id']) }}" method="GET" style="background-color: #4F4F4F; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 14px;">
                Bearbeiten
            </a>

            <!-- Löschen-Formular -->
            <form action="{{ url_for('delete', post_id=blogpost['id']) }}" method="POST" style="margin: 0;">
                <button type="submit" style="background-color: #d9534f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 14px;">
                    Delete Entry
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
</body>
</html>
